name: CI develop (frontend)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, release, "release/**"]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test design tokens
        run: npm run test:tokens

      - name: Test api:check decisions
        run: npm run test:api-check

      # Contrat OpenAPI d'une révision backend explicite (vars.BACKEND_CONTRACT_REF,
      # défaut develop) — pas seulement les tests unitaires du script api-check.
      - name: Checkout backend OpenAPI contract
        uses: actions/checkout@v4
        with:
          repository: tirlipinpon/appv4-back
          ref: ${{ vars.BACKEND_CONTRACT_REF || 'develop' }}
          path: .ci/appv4-back
          sparse-checkout: |
            openapi/openapi.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Require backend OpenAPI file
        id: backend-contract
        run: |
          CONTRACT=".ci/appv4-back/openapi/openapi.json"
          if [ ! -f "$CONTRACT" ]; then
            echo "::error::Contrat OpenAPI backend absent ($CONTRACT). Refus explicite."
            exit 1
          fi
          SHA="$(git -C .ci/appv4-back rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Backend contract ref=${{ vars.BACKEND_CONTRACT_REF || 'develop' }} sha=$SHA"

      - name: Check OpenAPI TypeScript schemas
        run: npm run api:check
        env:
          APPV4_OPENAPI_PATH: .ci/appv4-back/openapi/openapi.json

      - name: Install Chrome for Karma
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Unit tests learning
        run: npm run test:learning
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Unit tests admin
        run: npm run test:admin
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build learning
        run: npm run build:learning

      - name: Build admin
        run: npm run build:admin
