name: CI develop (frontend)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, release, "release/**"]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Install Chrome for Karma
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Unit tests learning
        run: npm run test:learning
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Unit tests admin
        run: npm run test:admin
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build learning
        run: npm run build:learning

      - name: Build admin
        run: npm run build:admin
