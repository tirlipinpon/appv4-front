name: CI develop (frontend)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build learning
        run: npm run build:learning

      - name: Build admin
        run: npm run build:admin
