# CD Azure — déclenché uniquement après merge vers release (via PR develop → release).
# Squelette SCRUM-74 : build OK ; deploy activé quand les secrets (SCRUM-75) + Azure (SCRUM-76+) sont prêts.
name: CD release (frontend)

on:
  push:
    branches:
      - release
      - "release/**"
  workflow_dispatch:

concurrency:
  group: cd-front-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Install Chrome for Karma
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Unit tests learning
        run: npm run test:learning
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Unit tests admin
        run: npm run test:admin
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build learning
        run: npm run build:learning

      - name: Build admin
        run: npm run build:admin

      - name: Upload learning dist
        uses: actions/upload-artifact@v4
        with:
          name: learning-dist
          path: dist/learning/browser
          if-no-files-found: error
          retention-days: 7

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/admin/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Déployer seulement si le flag repo est activé (après provision Azure SCRUM-76+).
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Download learning dist
        uses: actions/download-artifact@v4
        with:
          name: learning-dist
          path: dist/learning

      - name: Download admin dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: dist/admin

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy learning + admin to Azure
        env:
          AZURE_SWA_LEARNING_TOKEN: ${{ secrets.AZURE_SWA_LEARNING_TOKEN }}
          AZURE_SWA_ADMIN_TOKEN: ${{ secrets.AZURE_SWA_ADMIN_TOKEN }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          echo "SCRUM-76+ : brancher ici le deploy réel (Static Web Apps ou App Service)."
          echo "Artefacts présents :"
          ls -la dist/learning dist/admin
          # Exemple SWA (à adapter après ADR SCRUM-76) :
          # npx @azure/static-web-apps-cli deploy dist/learning \
          #   --deployment-token "$AZURE_SWA_LEARNING_TOKEN" --env production
          # npx @azure/static-web-apps-cli deploy dist/admin \
          #   --deployment-token "$AZURE_SWA_ADMIN_TOKEN" --env production
          exit 1
