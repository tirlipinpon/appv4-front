@if (showOpenParent()) {
  <button mat-button class="space-action" type="button" [disabled]="loading()" (click)="openParent()">
    Ouvrir l'espace parent
  </button>
}
@if (showRequestTeacher()) {
  <button mat-button class="space-action" type="button" [disabled]="loading()" (click)="requestTeacher()">
    Demander l'espace professeur
  </button>
}
@if (showViewRequest()) {
  <button mat-button class="space-action" type="button" [disabled]="loading()" (click)="viewRequest()">
    Voir ma demande
  </button>
}
@if (error()) {
  <span class="space-error" role="alert">{{ error() }}</span>
}
