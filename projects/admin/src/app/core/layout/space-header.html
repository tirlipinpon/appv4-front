<div class="banner">
  <mat-toolbar color="primary">
    @if (avatarFace(); as face) {
      <span class="face" aria-hidden="true">{{ face }}</span>
    }
    <span class="who" data-testid="account-name">{{ displayName() }}</span>
    @if (showSpaceActions()) {
      <app-role-switch />
    }
    <span class="spacer"></span>
    @if (showSpaceActions()) {
      <app-space-access />
    }
    <button mat-button class="logout" type="button" data-testid="account-logout" (click)="logout()">Déconnexion</button>
  </mat-toolbar>
  @if (showSpaceActions() && menu(); as section) {
    <nav class="subnav" data-testid="space-nav" [attr.aria-label]="section.label">
      @for (item of section.items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-current"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          [attr.data-testid]="item.testId"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  }
</div>
