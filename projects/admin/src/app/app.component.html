<div class="page">
  <mat-toolbar color="primary">
    <span>appv4 · admin</span>
  </mat-toolbar>

  <main class="content">
    <mat-card class="hello-card">
      <mat-card-header>
        <mat-card-title>Hello smoke</mat-card-title>
        <mat-card-subtitle>GET /api/int/hello</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        @if (loading()) {
          <div class="loading">
            <mat-spinner diameter="40"></mat-spinner>
          </div>
        } @else if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
          <p class="hint">Vérifie que le backend tourne sur http://localhost:8080</p>
        } @else {
          <h1>{{ message() }}</h1>
        }
      </mat-card-content>
    </mat-card>
  </main>
</div>
