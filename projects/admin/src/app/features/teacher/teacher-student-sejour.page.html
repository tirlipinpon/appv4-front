<div class="page">
  <app-space-header />

  <main class="content content-wide">
    @if (loading()) {
      <p>Chargement…</p>
    }
    @if (error(); as message) {
      <p class="error" role="alert" data-testid="teacher-sejour-error">{{ message }}</p>
    }

    @if (name(); as childName) {
      <h1 data-testid="teacher-sejour-child">{{ childName }}</h1>
    }
    <app-sejour-list [sejours]="sejours()" testId="teacher-sejour" />
  </main>
</div>
