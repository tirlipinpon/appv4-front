<div class="page">
  <app-space-header />

  <main class="content content-wide">
    <h1>Temps</h1>

    @if (loading()) {
      <p>Chargement…</p>
    }
    @if (error(); as message) {
      <p class="error" role="alert" data-testid="parent-temps-error">{{ message }}</p>
    }

    @if (children().length > 0) {
      <div class="picks">
        @for (child of children(); track child.id) {
          <button
            type="button"
            [attr.data-testid]="'parent-temps-pick-' + child.id"
            [attr.aria-current]="child.id === selectedId() ? 'true' : null"
            (click)="select(child.id)"
          >
            {{ child.firstName }}
          </button>
        }
      </div>
    }

    @if (selected(); as child) {
      <p class="child" data-testid="parent-temps-child">{{ child.firstName }} {{ child.lastName }}</p>
    }

    @if (month(); as shown) {
      <app-journee-month [month]="shown" testId="parent-temps" (previous)="previous()" (next)="next()" />
      <app-parent-temps-evolution [month]="shown" />
    }
  </main>
</div>
