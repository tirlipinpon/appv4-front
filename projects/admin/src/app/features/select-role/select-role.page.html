<div class="page">
  <mat-toolbar color="primary">
    <span>appv4</span>
  </mat-toolbar>
  <main class="content content-center">
    <mat-card class="card">
      <mat-card-header>
        <mat-card-title>Choisis ton espace</mat-card-title>
        <mat-card-subtitle>Parent ou professeur, sur le même compte</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <div class="choices">
          @for (role of choices; track role) {
            <button
              mat-flat-button
              color="primary"
              type="button"
              [disabled]="loading()"
              (click)="choose(role)"
            >
              {{ buttonLabel(role) }}
            </button>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </main>
</div>
