<div class="page">
  <mat-toolbar color="primary">
    <span>appv4 · admin · connexion</span>
  </mat-toolbar>

  <main class="content">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Connexion</mat-card-title>
        <mat-card-subtitle>Google · Facebook</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          class="oauth-btn"
          type="button"
          [disabled]="googleLoading() || facebookLoading()"
          (click)="continueWithGoogle()"
        >
          {{ googleLoading() ? 'Redirection…' : 'Continuer avec Google' }}
        </button>

        <button
          mat-stroked-button
          class="oauth-btn facebook-btn"
          type="button"
          [disabled]="googleLoading() || facebookLoading()"
          (click)="continueWithFacebook()"
        >
          {{ facebookLoading() ? 'Redirection…' : 'Continuer avec Facebook' }}
        </button>

        <mat-divider class="divider"></mat-divider>

        <p class="dev-hint">Smoke dev — coller un JWT (sans OAuth)</p>
        <mat-form-field appearance="outline" class="full">
          <mat-label>JWT</mat-label>
          <textarea matInput rows="3" [(ngModel)]="tokenInput" name="token"></textarea>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions align="end">
        <a mat-button routerLink="/signup">Créer un compte</a>
        <button mat-button type="button" (click)="submitToken()">Entrer avec JWT</button>
      </mat-card-actions>
    </mat-card>
  </main>
</div>
