<div class="page">
  <mat-toolbar color="primary">
    <span>appv4 · admin · connexion</span>
  </mat-toolbar>

  <main class="content">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Connexion</mat-card-title>
        <mat-card-subtitle>Email, mot de passe ou OAuth</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <mat-form-field appearance="outline" class="full">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            name="email"
            autocomplete="username"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            required
          />
        </mat-form-field>
        @if (emailFormatError()) {
          <p class="error" role="alert">{{ emailFormatError() }}</p>
        }

        <mat-form-field appearance="outline" class="full">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            required
            (keyup.enter)="submit()"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="showPassword()"
          >
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          class="oauth-btn"
          type="button"
          [disabled]="!canSubmit()"
          (click)="submit()"
        >
          {{ loading() ? 'Connexion…' : 'Se connecter' }}
        </button>

        <mat-divider class="divider"></mat-divider>

        <button
          mat-stroked-button
          class="oauth-btn"
          type="button"
          [disabled]="busy()"
          (click)="continueWithGoogle()"
        >
          {{ googleLoading() ? 'Redirection…' : 'Continuer avec Google' }}
        </button>

        <button
          mat-stroked-button
          class="oauth-btn facebook-btn"
          type="button"
          [disabled]="busy()"
          (click)="continueWithFacebook()"
        >
          {{ facebookLoading() ? 'Redirection…' : 'Continuer avec Facebook' }}
        </button>
      </mat-card-content>
      <mat-card-actions align="end">
        <a mat-button routerLink="/forgot-password">Mot de passe oublié ?</a>
        <a mat-button routerLink="/signup">Créer un compte</a>
      </mat-card-actions>
    </mat-card>
  </main>
</div>
