<div class="picker" [attr.data-testid]="testId()">
  <div class="toolbar">
    <mat-form-field appearance="outline" class="search">
      <mat-label>Rechercher une icône</mat-label>
      <input
        matInput
        type="search"
        [attr.data-testid]="testId() + '-search'"
        [value]="query()"
        [disabled]="disabled()"
        (input)="onQuery(inputValue($event))"
        placeholder="ex. maths, livre, sport"
      />
    </mat-form-field>
    <button
      type="button"
      class="none"
      [attr.data-testid]="testId() + '-none'"
      [class.selected]="!value()"
      [disabled]="disabled()"
      (click)="clear()"
    >
      Sans icône
    </button>
  </div>

  @if (value(); as selected) {
    <p class="current" [attr.data-testid]="testId() + '-current'">
      <span class="glyph" aria-hidden="true">{{ glyph(selected) }}</span>
      <span>{{ label() }} sélectionnée</span>
    </p>
  }

  <div class="grid" role="listbox" [attr.aria-label]="label()">
    @for (choice of filtered(); track choice.code) {
      <button
        type="button"
        class="cell"
        role="option"
        [attr.data-testid]="testId() + '-opt-' + choice.code"
        [attr.aria-selected]="value() === choice.code"
        [class.selected]="value() === choice.code"
        [disabled]="disabled()"
        [title]="choice.label"
        (click)="pick(choice.code ?? '')"
      >
        <span class="glyph" aria-hidden="true">{{ glyph(choice.code) }}</span>
        <span class="caption">{{ choice.label }}</span>
      </button>
    } @empty {
      <p class="empty" role="status">Aucune icône pour « {{ query() }} ».</p>
    }
  </div>
</div>
